# Wacky Races native port settings.
# Copy to ~/.config/wackyraces/config.ini (or pass --config FILE, or set
# WPC_CONFIG). Command-line options and WPC_DATA/WPC_DISC/WPC_LANG override it.
# '~' is your home directory; relative paths start from this file's folder.

[paths]
# The installed game: menu.WGM, general.wgm, STRINGS.DAT, legal.avi, Voice/...
data = ~/.wine/drive_c/Program Files (x86)/Infogrames/Wacky Races
# Where the Wacky Races CD is mounted (or a folder with its cc, sh, dt, ct, dr,
# Movies and Music directories).
disc = /run/media/USER/Wacky

[game]
# 0 English, 1 German, 2 Spanish, 3 French, 4 Italian, 5 Dutch, 6 Portuguese
language = 0
# Go straight to the main menu: no legal.avi, L2/L3 cards or intro movie.
skip_intro = false
# The original POUSSIERE option (off by default): extra dust behind the wheels.
dust = false

[video]
# Window size as WIDTHxHEIGHT; leave unset for the default 640x480. The picture
# keeps the original 4:3 shape, centred.
# resolution = 1280x960
# fullscreen = true      # full screen (also --fullscreen or WPC_FULLSCREEN=1)
